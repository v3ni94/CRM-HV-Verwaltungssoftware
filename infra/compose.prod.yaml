# Production and staging overlay. No Traefik service: the IONOS server already runs Traefik
# (MASTER-PROMPT 3.1). Public services join the external Traefik network and are routed by
# labels; no ports are published.
#
# prod:    docker compose -p mhvp --env-file .env.prod -f infra/compose.yaml -f infra/compose.prod.yaml up -d
# staging: docker compose -p mhvp-staging --env-file .env.staging -f infra/compose.yaml -f infra/compose.prod.yaml up -d
#          (set MHVP_ENV=staging, MHVP_HOST_* and MHVP_TRAEFIK_PREFIX=mhvp-staging)
#
# MHVP_TRAEFIK_PREFIX keeps router/middleware names unique when prod and staging share one Traefik.

x-prod: &prod
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

# Images come from the GitHub Container Registry (M1-03, decided 26.09.2026): private packages
# under ghcr.io/v3ni94, built and pushed by .github/workflows/images.yml with the VERSION file
# content as tag. The server logs in once with a fine grained PAT (read:packages), then
# `docker compose pull` (docs/runbooks/server-setup.md section 4). Fallback without registry:
# DEPLOY_BUILD=1 or the manual block in server-setup.md builds the images on the server under
# MHVP_IMAGE_REGISTRY=local with the same tag.
x-api-image: &api-image
  image: ${MHVP_IMAGE_REGISTRY:-ghcr.io/v3ni94}/mhvp-api:${MHVP_IMAGE_TAG:-latest}

# Object storage: local SeaweedFS container "objectstore" of the base file is the standard
# (operator decision 27.09.2026, docs/runbooks/objektspeicher-ionos-s3.md section 0). The
# defaults therefore point at http://objectstore:8333. An external S3 endpoint (IONOS) is
# optional: set MHVP_S3_ENDPOINT_URL and MHVP_S3_REGION in .env.prod and stop the container
# (docker compose stop objectstore). Names as read by mhvp.core.config.Settings (prefix MHVP_).
# Malware scan is mandatory in prod and staging (Settings refuses any other mode).
x-scan-env: &scan-env
  MHVP_CLAMAV_MODE: ${MHVP_CLAMAV_MODE:-enforce}

x-s3-env: &s3-env
  MHVP_S3_ENDPOINT_URL: ${MHVP_S3_ENDPOINT_URL:-http://objectstore:8333}
  MHVP_S3_REGION: ${MHVP_S3_REGION:-us-east-1}
  MHVP_S3_BUCKET: ${MHVP_S3_BUCKET:-mhvp}

services:
  postgres:
    <<: *prod
    # Sized for the operator server (32 cores, 64 threads, 251 GB RAM, shared with other
    # stacks). Override per host in .env.prod; values are PostgreSQL settings, not limits of
    # the application. The connection budget must cover API workers x (pool 5 + overflow 10)
    # plus Celery processes.
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-4GB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-16GB}
      - -c
      - work_mem=${PG_WORK_MEM:-32MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-1GB}
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-300}
      - -c
      - max_worker_processes=${PG_MAX_WORKER_PROCESSES:-32}
      - -c
      - max_parallel_workers=${PG_MAX_PARALLEL_WORKERS:-16}
      - -c
      - max_parallel_workers_per_gather=${PG_MAX_PARALLEL_WORKERS_PER_GATHER:-4}
      - -c
      - max_parallel_maintenance_workers=${PG_MAX_PARALLEL_MAINTENANCE_WORKERS:-4}
      - -c
      - wal_buffers=64MB
      - -c
      - random_page_cost=${PG_RANDOM_PAGE_COST:-1.1}
      - -c
      - effective_io_concurrency=${PG_EFFECTIVE_IO_CONCURRENCY:-200}
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - max_wal_size=${PG_MAX_WAL_SIZE:-4GB}
      # WAL archiving for point in time recovery (docs/runbooks/backup.md, "WAL-Archivierung").
      # Every completed segment is copied once into the bind mounted BACKUP_WAL_DIR; an
      # existing file is never overwritten (PostgreSQL retries the segment on failure and
      # keeps it in pg_wal until the copy succeeds). backup-offsite.sh encrypts and uploads
      # new segments with the daily run. PG_ARCHIVE_MODE=off disables archiving (dev never
      # archives: compose.dev.yaml carries no archive settings).
      - -c
      - archive_mode=${PG_ARCHIVE_MODE:-on}
      - -c
      - archive_command=test ! -f /var/lib/postgresql/wal-archive/%f && cp %p /var/lib/postgresql/wal-archive/%f
      - -c
      - archive_timeout=${PG_ARCHIVE_TIMEOUT:-900}
    volumes:
      # Host directory of the WAL archive (BACKUP_WAL_DIR in .env.prod and infra/env.backup);
      # must be writable by the postgres user of the container (uid 999).
      - ${BACKUP_WAL_DIR:-/srv/mhvp-backup/wal}:/var/lib/postgresql/wal-archive
    shm_size: ${PG_SHM_SIZE:-2g}

  redis:
    <<: *prod

  objectstore:
    # Local SeaweedFS as the permanent document store (ADR 0005, Nachtrag 27.09.2026). Always
    # started, no profile; data in the volume objectstore-data (project name prefix on the
    # server: mhvp_objectstore-data), archived daily by scripts/backup.sh via
    # BACKUP_OBJECTSTORE_VOLUME. No ports are published; the API reaches it on the stack network.
    <<: *prod

  clamav:
    # Always on in prod/staging (docs/runbooks/virenscan.md): the profile of the base file is
    # removed, signatures update via freshclam inside the container (outbound HTTPS to
    # database.clamav.net). First start downloads about 300 MB before clamd answers.
    <<: *prod
    profiles: !override []

  migrate:
    <<: *api-image
    environment:
      <<: [*s3-env, *scan-env]
      MHVP_ENV: ${MHVP_ENV:-prod}
    # Keeps the base dependency list (postgres healthy, objectstore healthy): the bucket
    # bootstrap (mhvp.core.storage_bootstrap) needs the local store. With an optional external
    # endpoint the local container is still healthy and simply unused.

  api:
    <<: [*prod, *api-image]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    # One process per worker; each holds its own connection pool (5 + 10 overflow).
    command:
      - uvicorn
      - mhvp.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --workers
      - ${MHVP_API_WORKERS:-8}
    environment:
      <<: [*s3-env, *scan-env]
      MHVP_ENV: ${MHVP_ENV:-prod}
      # Operating metrics read the off-site status line of scripts/backup-offsite.sh
      # (jobs.backup_offsite in /platform/ops/metrics); the host BACKUP_DIR is mounted read only.
      BACKUP_DIR: /srv/mhvp-backup
    volumes:
      - ${BACKUP_DIR:-/srv/mhvp-backup}:/srv/mhvp-backup:ro
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:?TRAEFIK_NETWORK must be set}"
      # Shared middlewares for all MHVP routers of this stack.
      - "traefik.http.middlewares.${MHVP_TRAEFIK_PREFIX:-mhvp}-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.${MHVP_TRAEFIK_PREFIX:-mhvp}-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.${MHVP_TRAEFIK_PREFIX:-mhvp}-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.${MHVP_TRAEFIK_PREFIX:-mhvp}-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.${MHVP_TRAEFIK_PREFIX:-mhvp}-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.${MHVP_TRAEFIK_PREFIX:-mhvp}-headers.headers.customresponseheaders.Permissions-Policy=camera=(), microphone=(), geolocation=(), payment=()"
      - "traefik.http.middlewares.${MHVP_TRAEFIK_PREFIX:-mhvp}-ratelimit.ratelimit.average=100"
      - "traefik.http.middlewares.${MHVP_TRAEFIK_PREFIX:-mhvp}-ratelimit.ratelimit.burst=200"
      - "traefik.http.middlewares.${MHVP_TRAEFIK_PREFIX:-mhvp}-ratelimit.ratelimit.period=1s"
      - "traefik.http.routers.${MHVP_TRAEFIK_PREFIX:-mhvp}-api.rule=Host(`${MHVP_HOST_API:-api.mueller-holding.ag}`)"
      - "traefik.http.routers.${MHVP_TRAEFIK_PREFIX:-mhvp}-api.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.${MHVP_TRAEFIK_PREFIX:-mhvp}-api.tls.certresolver=${TRAEFIK_CERTRESOLVER:?TRAEFIK_CERTRESOLVER must be set}"
      - "traefik.http.routers.${MHVP_TRAEFIK_PREFIX:-mhvp}-api.middlewares=${MHVP_TRAEFIK_PREFIX:-mhvp}-headers,${MHVP_TRAEFIK_PREFIX:-mhvp}-ratelimit"
      - "traefik.http.routers.${MHVP_TRAEFIK_PREFIX:-mhvp}-api.service=${MHVP_TRAEFIK_PREFIX:-mhvp}-api"
      - "traefik.http.services.${MHVP_TRAEFIK_PREFIX:-mhvp}-api.loadbalancer.server.port=8000"

  worker:
    <<: [*prod, *api-image]
    # Prefork processes; OCR and statements are CPU bound, AI and bank tasks wait on I/O.
    command:
      - celery
      - -A
      - mhvp.worker
      - worker
      - --loglevel
      - INFO
      - -Q
      - default,io,ocr,ai,bank,mail,beat
      - --concurrency
      - ${MHVP_WORKER_CONCURRENCY:-16}
      - --prefetch-multiplier
      - "1"
      - --max-tasks-per-child
      - "200"
    environment:
      <<: [*s3-env, *scan-env]
      MHVP_ENV: ${MHVP_ENV:-prod}

  beat:
    <<: [*prod, *api-image]
    environment:
      <<: [*s3-env, *scan-env]
      MHVP_ENV: ${MHVP_ENV:-prod}

  web-crm:
    <<: *prod
    image: ${MHVP_IMAGE_REGISTRY:-ghcr.io/v3ni94}/mhvp-web-crm:${MHVP_IMAGE_TAG:-latest}
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:?TRAEFIK_NETWORK must be set}"
      - "traefik.http.routers.${MHVP_TRAEFIK_PREFIX:-mhvp}-crm.rule=Host(`${MHVP_HOST_CRM:-crm.mueller-holding.ag}`)"
      - "traefik.http.routers.${MHVP_TRAEFIK_PREFIX:-mhvp}-crm.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.${MHVP_TRAEFIK_PREFIX:-mhvp}-crm.tls.certresolver=${TRAEFIK_CERTRESOLVER:?TRAEFIK_CERTRESOLVER must be set}"
      - "traefik.http.routers.${MHVP_TRAEFIK_PREFIX:-mhvp}-crm.middlewares=${MHVP_TRAEFIK_PREFIX:-mhvp}-headers"
      - "traefik.http.routers.${MHVP_TRAEFIK_PREFIX:-mhvp}-crm.service=${MHVP_TRAEFIK_PREFIX:-mhvp}-crm"
      - "traefik.http.routers.${MHVP_TRAEFIK_PREFIX:-mhvp}-crm-api.rule=Host(`${MHVP_HOST_CRM:-crm.mueller-holding.ag}`) && (PathPrefix(`/api`) || PathPrefix(`/auth`))"
      - "traefik.http.routers.${MHVP_TRAEFIK_PREFIX:-mhvp}-crm-api.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.${MHVP_TRAEFIK_PREFIX:-mhvp}-crm-api.tls.certresolver=${TRAEFIK_CERTRESOLVER:?TRAEFIK_CERTRESOLVER must be set}"
      - "traefik.http.routers.${MHVP_TRAEFIK_PREFIX:-mhvp}-crm-api.middlewares=${MHVP_TRAEFIK_PREFIX:-mhvp}-headers,${MHVP_TRAEFIK_PREFIX:-mhvp}-ratelimit"
      - "traefik.http.routers.${MHVP_TRAEFIK_PREFIX:-mhvp}-crm-api.service=${MHVP_TRAEFIK_PREFIX:-mhvp}-crm"
      - "traefik.http.services.${MHVP_TRAEFIK_PREFIX:-mhvp}-crm.loadbalancer.server.port=3000"

  web-portal:
    <<: *prod
    image: ${MHVP_IMAGE_REGISTRY:-ghcr.io/v3ni94}/mhvp-web-portal:${MHVP_IMAGE_TAG:-latest}
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:?TRAEFIK_NETWORK must be set}"
      - "traefik.http.routers.${MHVP_TRAEFIK_PREFIX:-mhvp}-portal.rule=Host(`${MHVP_HOST_PORTAL_HVM:-portal.muellerhv.de}`) || Host(`${MHVP_HOST_PORTAL_MHAG:-portal.mueller-holding.ag}`)"
      - "traefik.http.routers.${MHVP_TRAEFIK_PREFIX:-mhvp}-portal.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.${MHVP_TRAEFIK_PREFIX:-mhvp}-portal.tls.certresolver=${TRAEFIK_CERTRESOLVER:?TRAEFIK_CERTRESOLVER must be set}"
      - "traefik.http.routers.${MHVP_TRAEFIK_PREFIX:-mhvp}-portal.middlewares=${MHVP_TRAEFIK_PREFIX:-mhvp}-headers"
      - "traefik.http.routers.${MHVP_TRAEFIK_PREFIX:-mhvp}-portal.service=${MHVP_TRAEFIK_PREFIX:-mhvp}-portal"
      - "traefik.http.routers.${MHVP_TRAEFIK_PREFIX:-mhvp}-portal-api.rule=(Host(`${MHVP_HOST_PORTAL_HVM:-portal.muellerhv.de}`) || Host(`${MHVP_HOST_PORTAL_MHAG:-portal.mueller-holding.ag}`)) && (PathPrefix(`/api`) || PathPrefix(`/auth`))"
      - "traefik.http.routers.${MHVP_TRAEFIK_PREFIX:-mhvp}-portal-api.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.${MHVP_TRAEFIK_PREFIX:-mhvp}-portal-api.tls.certresolver=${TRAEFIK_CERTRESOLVER:?TRAEFIK_CERTRESOLVER must be set}"
      - "traefik.http.routers.${MHVP_TRAEFIK_PREFIX:-mhvp}-portal-api.middlewares=${MHVP_TRAEFIK_PREFIX:-mhvp}-headers,${MHVP_TRAEFIK_PREFIX:-mhvp}-ratelimit"
      - "traefik.http.routers.${MHVP_TRAEFIK_PREFIX:-mhvp}-portal-api.service=${MHVP_TRAEFIK_PREFIX:-mhvp}-portal"
      - "traefik.http.services.${MHVP_TRAEFIK_PREFIX:-mhvp}-portal.loadbalancer.server.port=3001"

  uptime-kuma:
    # Monitoring and alerting on the server (M9-04, decided 26.09.2026): Uptime Kuma checks the
    # health endpoints and the ops metrics and notifies the operator by e-mail. Which monitors
    # to create: docs/runbooks/monitoring.md. No password in files: the administrator account
    # is created in the browser at the first call, so open the host right after the first
    # start. Data (monitors, notifications, history) live in the named volume.
    #
    # Database (operator decision in the setup dialog, 27.09.2026): embedded MariaDB instead of
    # the SQLite default (docs/runbooks/monitoring.md section "Datenbank: Embedded MariaDB").
    # UPTIME_KUMA_ENABLE_EMBEDDED_MARIADB starts a MariaDB process inside the same container and
    # writes it under /app/data alongside the monitor history; whether it needs its own resource
    # headroom beyond the limits below is not confirmed from the official docs and is tracked as
    # open in the runbook.
    <<: *prod
    image: louislam/uptime-kuma:2
    security_opt:
      - no-new-privileges:true
    environment:
      UPTIME_KUMA_ENABLE_EMBEDDED_MARIADB: "1"
    volumes:
      - uptime-kuma-data:/app/data
    healthcheck:
      test: ["CMD", "node", "extra/healthcheck.js"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:?TRAEFIK_NETWORK must be set}"
      - "traefik.http.routers.${MHVP_TRAEFIK_PREFIX:-mhvp}-monitoring.rule=Host(`${MHVP_HOST_MONITORING:?MHVP_HOST_MONITORING must be set (subdomain of Uptime Kuma, see docs/runbooks/monitoring.md)}`)"
      - "traefik.http.routers.${MHVP_TRAEFIK_PREFIX:-mhvp}-monitoring.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.${MHVP_TRAEFIK_PREFIX:-mhvp}-monitoring.tls.certresolver=${TRAEFIK_CERTRESOLVER:?TRAEFIK_CERTRESOLVER must be set}"
      - "traefik.http.routers.${MHVP_TRAEFIK_PREFIX:-mhvp}-monitoring.middlewares=${MHVP_TRAEFIK_PREFIX:-mhvp}-headers"
      - "traefik.http.routers.${MHVP_TRAEFIK_PREFIX:-mhvp}-monitoring.service=${MHVP_TRAEFIK_PREFIX:-mhvp}-monitoring"
      - "traefik.http.services.${MHVP_TRAEFIK_PREFIX:-mhvp}-monitoring.loadbalancer.server.port=3001"

  beszel:
    # Host and container metrics (server: CPU, RAM, disk, network; per container: CPU, RAM,
    # network), operator decision 27.09.2026, hub half of Beszel (github.com/henrygd/beszel).
    # Public UI on its own subdomain behind Traefik; first admin account is created in the
    # browser at the first call, no password in files. Alarms (CPU > 90 % over 10 minutes,
    # RAM > 90 %, disk > 85 %) are configured in the hub, see docs/runbooks/monitoring.md
    # section "Statusseite".
    <<: *prod
    image: henrygd/beszel:latest
    security_opt:
      - no-new-privileges:true
    environment:
      APP_URL: https://${MHVP_HOST_METRICS:?MHVP_HOST_METRICS must be set (subdomain of Beszel, see docs/runbooks/monitoring.md)}
    # Bound to loopback only (not exposed further by Traefik's own network): lets the
    # beszel-agent service below, which runs with network_mode: host for correct host network
    # metrics, reach the hub via localhost without a second public port.
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - beszel-data:/beszel_data
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:?TRAEFIK_NETWORK must be set}"
      - "traefik.http.routers.${MHVP_TRAEFIK_PREFIX:-mhvp}-metrics.rule=Host(`${MHVP_HOST_METRICS}`)"
      - "traefik.http.routers.${MHVP_TRAEFIK_PREFIX:-mhvp}-metrics.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.${MHVP_TRAEFIK_PREFIX:-mhvp}-metrics.tls.certresolver=${TRAEFIK_CERTRESOLVER:?TRAEFIK_CERTRESOLVER must be set}"
      - "traefik.http.routers.${MHVP_TRAEFIK_PREFIX:-mhvp}-metrics.middlewares=${MHVP_TRAEFIK_PREFIX:-mhvp}-headers"
      - "traefik.http.routers.${MHVP_TRAEFIK_PREFIX:-mhvp}-metrics.service=${MHVP_TRAEFIK_PREFIX:-mhvp}-metrics"
      - "traefik.http.services.${MHVP_TRAEFIK_PREFIX:-mhvp}-metrics.loadbalancer.server.port=8090"

  beszel-agent:
    # Reads host and container metrics for the beszel hub above. Per the upstream compose
    # examples (github.com/henrygd/beszel, supplemental/docker/agent), the agent needs
    # network_mode: host to report host network throughput correctly, and a read only mount of
    # the Docker socket to report per container metrics; it does not join the Traefik network
    # and is not reachable from outside. HUB_URL addresses the hub via the host loopback
    # interface, which the hub's 127.0.0.1:8090 port mapping above provides.
    <<: *prod
    image: henrygd/beszel-agent:latest
    security_opt:
      - no-new-privileges:true
    network_mode: host
    volumes:
      - beszel-agent-data:/var/lib/beszel-agent
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      HUB_URL: http://localhost:8090
      # Empty until the hub issued key and token (docs/runbooks/monitoring.md); the agent then
      # starts but cannot register, the rest of the stack is not blocked.
      KEY: ${BESZEL_AGENT_KEY:-}
      TOKEN: ${BESZEL_AGENT_TOKEN:-}
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256m

volumes:
  uptime-kuma-data:
  beszel-data:
  beszel-agent-data:

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:?TRAEFIK_NETWORK must be set}
