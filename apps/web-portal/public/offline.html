<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MH Portal</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #2e2d2e;
        --muted: #6b6a6c;
        --border: #e4e2df;
        --gold: #e3ac48;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #17161a;
          --fg: #efece6;
          --muted: #b3b0aa;
          --border: #2f2d33;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        padding: 16px;
      }
      main {
        max-width: 24rem;
        border: 1px solid var(--border);
        border-left: 3px solid var(--gold);
        border-radius: 12px;
        padding: 24px;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 12px;
        color: var(--muted);
        line-height: 1.5;
      }
      button {
        border: 1px solid var(--border);
        background: transparent;
        color: var(--fg);
        border-radius: 8px;
        padding: 10px 14px;
        font: inherit;
        min-height: 44px;
      }
    </style>
  </head>
  <body>
    <main>
      <p style="font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase">MH Portal</p>
      <h1>Keine Verbindung</h1>
      <p>Das Portal ist derzeit nicht erreichbar. Ihre Daten werden nicht auf diesem Gerät gespeichert; sobald wieder eine Verbindung besteht, können Sie sich anmelden.</p>
      <button type="button" onclick="location.reload()">Erneut versuchen</button>
    </main>
  </body>
</html>
