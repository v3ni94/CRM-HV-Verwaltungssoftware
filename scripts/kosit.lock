# Pinned download sources of the KoSIT XRechnung validation (AC11-01, AA02-03, P05).
# Read by scripts/kosit_fetch.sh (make kosit-fetch) and by the CI job xrechnung-kosit.
# Format: KEY=VALUE, one per line, no quotes, no shell code (the file is parsed, not sourced).
# The environment variables of the same name (CI repository variables) override a value,
# so a new version can be tried without changing the repository.
#
# Provenance of the checksums (01.10.2026): both archives were downloaded a second time from
# the official GitHub release assets over a TLS-verified connection and hashed with sha256sum.
# The values equal the first download of 01.10.2026 (docs/runbooks/xrechnung-kosit.md). The
# publisher does not publish a checksum file (the .sha256 sidecar URLs answer 404), so these
# are hashes of the official release assets as downloaded, not publisher-signed values.
# Compare them with the release page before relying on them for a release decision.
#
# Updating a pin: docs/runbooks/xrechnung-kosit.md section "Pins aktualisieren". A value of
# PLACEHOLDER (or anything that is not 64 hex digits) makes the fetch stop with exit code 3.
#
# validator: github.com/itplr-kosit/validator, release v1.5.0, Apache License 2.0
