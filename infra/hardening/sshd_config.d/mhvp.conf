# Vorschlag (Betreiberentscheidung B18, docs/OPEN_QUESTIONS.md). Kein Wirkbetrieb: diese Datei
# wird nicht automatisch verteilt und liegt nicht unter /etc/ssh/sshd_config.d/ auf dem Server.
# Sie ergänzt, ersetzt aber nicht, die vorhandene Härtung in
# docs/runbooks/server-recovery-und-haertung.md Abschnitt C und scripts/server/harden-ssh.sh.
# Rollout und Rollback: siehe docs/runbooks/server-recovery-und-haertung.md Abschnitt C2b.
#
# Wirkung, sobald aktiv (Namensvorgabe 0- wie im bestehenden Runbook, damit die Datei vor
# fremden Drop-ins wie 50-cloud-init.conf oder 90-hardening.conf gelesen wird):
#   * Root-Anmeldung nur mit Schlüssel, kein Root-Passwort.
#   * Passwortanmeldung für alle Konten aus, nur Schlüsselanmeldung.
#   * Keine leeren Passwörter, kein PAM-Challenge-Response als Ausweichweg.
# Ohne Ausnahme für die Büro-IP des Betreibers (Abschnitt C2a des Runbooks); wer diese Ausnahme
# weiterhin braucht, ergänzt sie in einer eigenen Datei mit einem Namen vor `0-mhvp.conf`
# (z. B. `0-mhvp-ignoreip.conf`), niemals in dieser Datei.

PermitRootLogin prohibit-password
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitEmptyPasswords no
MaxAuthTries 4
LoginGraceTime 20
