version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /apps/api
    schedule:
      interval: weekly
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker-compose
    directory: /infra
    schedule:
      interval: weekly
    groups:
      compose-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: pgvector/pgvector
        versions: [">=0.9", "*-pg17", "*-pg18"]
      - dependency-name: redis
        versions: [">=8"]

  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/web-crm
      - /apps/web-portal
    schedule:
      interval: weekly
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
    # Language runtimes are fixed by MASTER-PROMPT 4.1/4.2 (Python 3.12, Node 22);
    # a runtime change needs an ADR, not a bot update. Postgres 16 and Redis 7 likewise.
    ignore:
      - dependency-name: python
        versions: [">=3.13"]
      - dependency-name: node
        versions: [">=23"]
