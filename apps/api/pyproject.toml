[project]
name = "mhvp"
version = "0.1.0"
description = "MH Verwaltungsplattform API, worker and domain logic"
requires-python = ">=3.12,<3.13"
# Exact versions are pinned in uv.lock (ADR 0001, E16). Ranges here only bound majors.
dependencies = [
    "alembic>=1.20.0,<2",
    "boto3>=1.43.100,<2",
    "celery[redis]>=5.6.3,<6",
    "fastapi>=0.141.1,<1",
    "httpx>=0.28.1,<1",
    "psycopg[binary]>=3.3.6,<4",
    "pydantic>=2.13.5,<3",
    "pydantic-settings>=2.15.0,<3",
    "redis>=6.4.0,<7",
    "sqlalchemy>=2.0.54,<2.1",
    "structlog>=26.1.0,<27",
    "uvicorn[standard]>=0.53.0,<1",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.100,<2",
    "celery-types>=0.26.0,<1",
    "moto[s3]>=5.2.3,<6",
    "mypy>=2.3.1,<3",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "pytest-cov>=7.1.0,<8",
    "ruff>=0.16.8,<1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "N", "C4", "SIM", "RUF", "ASYNC", "DTZ", "T20", "PT"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
# Integration tests build DDL/queries from module constants (probe table names).
"tests/integration/**" = ["S101", "S105", "S106", "S608"]
"alembic/**" = ["N999"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/mhvp", "tests"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["moto.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers --cov=mhvp --cov-report=term-missing"
markers = [
    "integration: requires a bootstrapped PostgreSQL (see docs/runbooks/local-development.md)",
]
filterwarnings = ["error::DeprecationWarning:mhvp.*"]

[tool.coverage.run]
branch = true
source = ["mhvp"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
