packages:
  - "apps/web-crm"
  - "apps/web-portal"
  - "packages/*"

# pnpm 10 blocks dependency lifecycle scripts by default; only these may run.
onlyBuiltDependencies:
  - unrs-resolver

# Optional native builds not needed by any script in this workspace.
ignoredBuiltDependencies:
  - "@parcel/watcher"
  - "@swc/core"

# Security overrides for transitive packages found by the image scan (Trivy, CI job images).
overrides:
  "postcss@<8.5.18": "^8.5.28"
