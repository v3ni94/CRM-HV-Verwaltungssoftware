# MHVP base stack (docs/plans/M1.md section 4). Combine with compose.dev.yaml or
# compose.prod.yaml; this file alone defines no images for the application services.
# Relative paths resolve against this directory (infra/).
name: mhvp

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true

x-app-env: &app-env
  MHVP_ENV: ${MHVP_ENV:-dev}
  MHVP_LOG_LEVEL: ${MHVP_LOG_LEVEL:-INFO}
  MHVP_LOG_FORMAT: ${MHVP_LOG_FORMAT:-json}
  # Tracing (M9-02) stays off while empty; example: http://otel-collector:4318 (profile otel).
  MHVP_OTEL_ENDPOINT: ${MHVP_OTEL_ENDPOINT:-}
  MHVP_APP_VERSION: ${MHVP_APP_VERSION:-0.1.0}
  MHVP_BUILD: ${MHVP_BUILD:-}
  # Runtime role mhvp_app (ADR 0002). Passwords must be URL safe.
  MHVP_DATABASE_URL: ${MHVP_DATABASE_URL:-postgresql+psycopg://mhvp_app:${MHVP_DB_APP_PASSWORD:?MHVP_DB_APP_PASSWORD must be set}@postgres:5432/${MHVP_DB_NAME:-mhvp}}
  MHVP_REDIS_URL: ${MHVP_REDIS_URL:-redis://redis:6379/0}
  MHVP_CELERY_BROKER_URL: ${MHVP_CELERY_BROKER_URL:-redis://redis:6379/1}
  MHVP_CELERY_RESULT_BACKEND: ${MHVP_CELERY_RESULT_BACKEND:-redis://redis:6379/2}
  MHVP_S3_ENDPOINT_URL: ${MHVP_S3_ENDPOINT_URL:-http://objectstore:8333}
  MHVP_S3_REGION: ${MHVP_S3_REGION:-us-east-1}
  MHVP_S3_ACCESS_KEY_ID: ${MHVP_S3_ACCESS_KEY_ID:?MHVP_S3_ACCESS_KEY_ID must be set}
  MHVP_S3_SECRET_ACCESS_KEY: ${MHVP_S3_SECRET_ACCESS_KEY:?MHVP_S3_SECRET_ACCESS_KEY must be set}
  MHVP_S3_BUCKET: ${MHVP_S3_BUCKET:-mhvp}
  MHVP_MASTER_KEY: ${MHVP_MASTER_KEY:?MHVP_MASTER_KEY must be set (python -m mhvp.core.auth.keys)}
  MHVP_JWT_PRIVATE_KEY: ${MHVP_JWT_PRIVATE_KEY:?MHVP_JWT_PRIVATE_KEY must be set}
  MHVP_JWT_ISSUER: ${MHVP_JWT_ISSUER:-http://api.localhost}
  # Public URLs: the OIDC discovery advertises ${MHVP_WEB_CRM_URL}/oidc/authorize as browser entry point.
  MHVP_API_PUBLIC_URL: ${MHVP_API_PUBLIC_URL:-}
  MHVP_WEB_CRM_URL: ${MHVP_WEB_CRM_URL:-}
  MHVP_WEBHOOK_ALLOW_PRIVATE_TARGETS: ${MHVP_WEBHOOK_ALLOW_PRIVATE_TARGETS:-false}
  # Malware scan before storing documents (docs/runbooks/virenscan.md). Dev default off; the
  # clamav service below is started with --profile clamav when MHVP_CLAMAV_MODE=warn|enforce.
  MHVP_CLAMAV_MODE: ${MHVP_CLAMAV_MODE:-off}
  MHVP_CLAMAV_HOST: ${MHVP_CLAMAV_HOST:-clamav}
  MHVP_CLAMAV_PORT: ${MHVP_CLAMAV_PORT:-3310}
  MHVP_CLAMAV_TIMEOUT_SECONDS: ${MHVP_CLAMAV_TIMEOUT_SECONDS:-30}
  # objektakte read API and webhook (M29 Stufe 4, docs/integrations/objektakte.md); empty = off.
  OBJEKTAKTE_API_URL: ${OBJEKTAKTE_API_URL:-}
  OBJEKTAKTE_API_TOKEN: ${OBJEKTAKTE_API_TOKEN:-}
  OBJEKTAKTE_WEBHOOK_SECRET: ${OBJEKTAKTE_WEBHOOK_SECRET:-}
  OBJEKTAKTE_TENANT: ${OBJEKTAKTE_TENANT:-}
  OBJEKTAKTE_UPLOAD_ENABLED: ${OBJEKTAKTE_UPLOAD_ENABLED:-false}
  # Google OAuth fallback client, Gmail sync and push (M20, docs/integrations/gmail-push.md);
  # empty = off. These were listed in env.prod.example but not handed to the containers.
  MHVP_GOOGLE_CLIENT_ID: ${MHVP_GOOGLE_CLIENT_ID:-}
  MHVP_GOOGLE_CLIENT_SECRET: ${MHVP_GOOGLE_CLIENT_SECRET:-}
  MHVP_GMAIL_SYNC_BATCH: ${MHVP_GMAIL_SYNC_BATCH:-50}
  MHVP_GMAIL_PUBSUB_TOPIC: ${MHVP_GMAIL_PUBSUB_TOPIC:-}
  MHVP_GMAIL_PUSH_TOKEN: ${MHVP_GMAIL_PUSH_TOKEN:-}
  MHVP_GMAIL_PUSH_AUDIENCE: ${MHVP_GMAIL_PUSH_AUDIENCE:-}
  # FinTS product registration of the Deutsche Kreditwirtschaft (docs/integrations/fints.md);
  # empty = FinTS off (MHVP-BANK-0007).
  MHVP_FINTS_PRODUCT_ID: ${MHVP_FINTS_PRODUCT_ID:-}
  MHVP_FINTS_PRODUCT_VERSION: ${MHVP_FINTS_PRODUCT_VERSION:-1.0}
  # objektakte dump import (M35).
  MHVP_OBJEKTAKTE_DUMP_DIR: ${MHVP_OBJEKTAKTE_DUMP_DIR:-/data/objektakte-export}
  MHVP_OBJEKTAKTE_DUMP_MAX_BYTES: ${MHVP_OBJEKTAKTE_DUMP_MAX_BYTES:-536870912}
  # uvicorn trusts X-Forwarded-* only from these addresses (set to the Traefik network).
  FORWARDED_ALLOW_IPS: ${MHVP_FORWARDED_ALLOW_IPS:-127.0.0.1}

x-app-depends: &app-depends
  migrate:
    condition: service_completed_successfully
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

x-python-app: &python-app
  <<: *hardening
  read_only: true
  tmpfs:
    - /tmp
  environment:
    <<: *app-env
  depends_on:
    <<: *app-depends

services:
  postgres:
    <<: *hardening
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      MHVP_DB_NAME: ${MHVP_DB_NAME:-mhvp}
      MHVP_DB_MIGRATOR_PASSWORD: ${MHVP_DB_MIGRATOR_PASSWORD:?MHVP_DB_MIGRATOR_PASSWORD must be set}
      MHVP_DB_APP_PASSWORD: ${MHVP_DB_APP_PASSWORD:?MHVP_DB_APP_PASSWORD must be set}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/bootstrap.sh:/opt/mhvp/postgres/bootstrap.sh:ro
      - ./postgres/sql:/opt/mhvp/postgres/sql:ro
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${MHVP_DB_NAME:-mhvp} -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    <<: *hardening
    image: redis:7.4-alpine
    user: "999:1000"
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  objectstore:
    # SeaweedFS as S3 store for dev/CI (ADR 0005). The application only uses the S3 API.
    <<: *hardening
    image: chrislusf/seaweedfs:4.47
    # uid/gid of the "seaweed" user created in the upstream image.
    user: "1000:1000"
    entrypoint: ["/bin/sh", "/opt/mhvp/objectstore/entrypoint.sh"]
    read_only: true
    tmpfs:
      - /tmp
    environment:
      MHVP_S3_ACCESS_KEY_ID: ${MHVP_S3_ACCESS_KEY_ID:?MHVP_S3_ACCESS_KEY_ID must be set}
      MHVP_S3_SECRET_ACCESS_KEY: ${MHVP_S3_SECRET_ACCESS_KEY:?MHVP_S3_SECRET_ACCESS_KEY must be set}
    volumes:
      - ./objectstore/entrypoint.sh:/opt/mhvp/objectstore/entrypoint.sh:ro
      - objectstore-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  clamav:
    # ClamAV daemon with freshclam signature updates (operator decision 27.09.2026). The API
    # streams every document over TCP 3310 (INSTREAM); no file is shared with the container.
    # Dev: only started with --profile clamav; prod/staging overlay removes the profile.
    <<: *hardening
    image: clamav/clamav:1.4
    profiles:
      - clamav
    environment:
      CLAMAV_NO_FRESHCLAMD: "false"
      CLAMD_STARTUP_TIMEOUT: "1800"
      # Larger than MHVP_DOCUMENT_MAX_BYTES so that no upload is truncated by clamd itself.
      CLAMD_CONF_StreamMaxLength: 200M
      CLAMD_CONF_MaxFileSize: 200M
      CLAMD_CONF_MaxScanSize: 400M
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 600s

  migrate:
    <<: *hardening
    read_only: true
    tmpfs:
      - /tmp
    command: ["sh", "-c", "alembic upgrade head && python -m mhvp.core.storage_bootstrap && python -m mhvp.platform.sync_roles"]
    environment:
      <<: *app-env
      MHVP_MIGRATION_DATABASE_URL: ${MHVP_MIGRATION_DATABASE_URL:-postgresql+psycopg://mhvp_migrator:${MHVP_DB_MIGRATOR_PASSWORD:?MHVP_DB_MIGRATOR_PASSWORD must be set}@postgres:5432/${MHVP_DB_NAME:-mhvp}}
    depends_on:
      postgres:
        condition: service_healthy
      # The bucket bootstrap needs a ready S3 endpoint, not just a started container.
      objectstore:
        condition: service_healthy
    restart: "no"

  otel-collector:
    # Optional OpenTelemetry collector (M9-02), only started with --profile otel. Receives OTLP
    # over HTTP (4318) from api and worker, logs spans to its own output (debug exporter);
    # point the exporters in infra/otel-collector.yaml to the tracing backend of choice.
    <<: *hardening
    image: otel/opentelemetry-collector-contrib:0.111.0
    profiles:
      - otel
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro

  api:
    <<: *python-app
    command: ["uvicorn", "mhvp.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  worker:
    <<: *python-app
    command: ["celery", "-A", "mhvp.worker", "worker", "--loglevel", "INFO", "-Q", "default,io,ocr,ai,bank,mail,beat"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A mhvp.worker inspect ping -d celery@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s

  beat:
    <<: *python-app
    command: ["celery", "-A", "mhvp.worker", "beat", "--loglevel", "INFO", "--schedule", "/tmp/celerybeat-schedule"]
    # The image healthcheck probes the API port; beat serves no HTTP. Job health is visible in
    # /api/v1/platform/ops/metrics (last run per job), so the inherited probe is disabled.
    healthcheck:
      disable: true

  web-crm:
    <<: *hardening
    environment:
      MHVP_API_INTERNAL_URL: ${MHVP_API_INTERNAL_URL:-http://api:8000}
      MHVP_DMS_URL: ${MHVP_DMS_URL:-https://uebernahme.muellerhv.de}
      MHVP_APP_VERSION: ${MHVP_APP_VERSION:-0.1.0}
      MHVP_BUILD: ${MHVP_BUILD:-}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s

  web-portal:
    <<: *hardening
    environment:
      MHVP_API_INTERNAL_URL: ${MHVP_API_INTERNAL_URL:-http://api:8000}
      MHVP_APP_VERSION: ${MHVP_APP_VERSION:-0.1.0}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  postgres-data:
  redis-data:
  objectstore-data:
  clamav-data:
