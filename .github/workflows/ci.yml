name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI-only throwaway credentials for ephemeral service containers. Not used anywhere else.
  CI_POSTGRES_PASSWORD: ci-postgres-pw
  CI_MIGRATOR_PASSWORD: ci-migrator-pw
  CI_APP_PASSWORD: ci-app-pw
  TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969

jobs:
  agent-docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/sync_agent_docs.py --check
      # GAJ-506: the same repository checks as `make lint`, directly in CI (not only via Vitest).
      - name: i18n consistency
        run: python3 scripts/check_i18n.py
      - name: i18n key usage
        run: python3 scripts/check_i18n_usage.py
      - name: Client import guard
        run: python3 scripts/check_client_imports.py
      - name: Handbook and help index up to date
        run: |
          python3 scripts/build_handbook.py --check
          python3 scripts/build_help_index.py --check
          python3 scripts/build_switch_index.py --check

  version-check:
    # VERSION, CHANGELOG.md und changelog.ts stimmen ueberein (GAI-112, scripts/bump_version.py).
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/bump_version.py --check

  commitlint:
    # Conventional Commits (GAI-113, CLAUDE.md Regel 12, scripts/check_commits.py); nur Pull Requests.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Commits der Pull Request pruefen
        env:
          PR_BASE: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$PR_BASE"
          python3 scripts/check_commits.py "origin/$PR_BASE..HEAD"

  restore-drill-dry-run:
    # Trockenlauf der Restore-Uebung (GAI-511): Konfiguration und Werkzeuge, kein S3, keine Datenbank.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends age
      - run: python3 -m pip install boto3
      - run: bash infra/scripts/tests/test-restore-drill.sh
      - name: make restore-drill DRY_RUN=1
        env:
          PGDATABASE: mhvp
          BACKUP_S3_BUCKET: ci-dry-run
          BACKUP_S3_ACCESS_KEY_ID: ci-dry-run
          BACKUP_S3_SECRET_ACCESS_KEY: ci-dry-run
        run: |
          echo "AGE-SECRET-KEY-CI-DRY-RUN" > "$RUNNER_TEMP/identity.txt"
          BACKUP_AGE_IDENTITY="$RUNNER_TEMP/identity.txt" make restore-drill DRY_RUN=1

  pitr-drill:
    # PITR mit WAL-Replay gegen einen Wegwerf-Cluster, Dauer gegen RTO 4 Stunden (GAJ-505).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-16
      - run: make pitr-drill-test

  secrets-scan:
    # Vollstaendiger Secrets-Scan der Historie dieses Pushs/PRs (Sicherheitspruefung 27.09.2026,
    # Befund 6 / OE-M27-02-03; der bisherige Muster-Grep deckte nur den aktuellen Stand ab).
    # Konfiguration und Allowlist: .gitleaks.toml.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo "$GITLEAKS_IMAGE" \
            detect --source=/repo --config=/repo/.gitleaks.toml --redact --verbose
        env:
          # Version festgepinnt (kein :latest); Digest kann in dieser Umgebung nicht aufgeloest
          # werden (kein Registry-Zugriff beim Erstellen dieses Jobs), daher vorerst per Tag.
          GITLEAKS_IMAGE: zricethezav/gitleaks:v8.21.2

  migrations-guard:
    # Sperre gegen Umnummerierung oder Loeschung gemergter Alembic-Migrationen (scripts/check-migrations.sh).
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Migrationen gegen Basis pruefen
        env:
          PR_BASE: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        # GAJ-507: a push is checked against the state before the push and, in addition,
        # against the newest release tag (or origin/main). Fetch errors fail the job.
        run: |
          set -euo pipefail
          bases=()
          if [ -n "$PR_BASE" ]; then
            git fetch --no-tags origin "$PR_BASE"
            bases+=("origin/$PR_BASE")
          else
            if [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] \
              && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
              bases+=("$PUSH_BEFORE")
            fi
            tag="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
            if [ -n "$tag" ]; then
              bases+=("$tag")
            elif git ls-remote --exit-code --heads origin main >/dev/null; then
              git fetch --no-tags origin main
              bases+=("origin/main")
            fi
          fi
          if [ "${#bases[@]}" -eq 0 ]; then
            echo "migrations-guard: keine Vergleichsbasis (weder Vorgaengerstand noch Tag noch main)" >&2
            exit 1
          fi
          for base in "${bases[@]}"; do
            scripts/check-migrations.sh "$base"
          done

  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg16
        env:
          POSTGRES_PASSWORD: ci-postgres-pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      MHVP_ENV: test
      MHVP_DATABASE_URL: postgresql+psycopg://mhvp_app:ci-app-pw@localhost:5432/mhvp
      MHVP_MIGRATION_DATABASE_URL: postgresql+psycopg://mhvp_migrator:ci-migrator-pw@localhost:5432/mhvp
      MHVP_REDIS_URL: redis://localhost:6379/0
      MHVP_CELERY_BROKER_URL: redis://localhost:6379/1
      MHVP_CELERY_RESULT_BACKEND: redis://localhost:6379/2
      # S3 tests use moto; the endpoint is a dummy.
      MHVP_S3_ENDPOINT_URL: http://localhost:8333
      MHVP_S3_REGION: us-east-1
      MHVP_S3_ACCESS_KEY_ID: ci-dummy
      MHVP_S3_SECRET_ACCESS_KEY: ci-dummy
      MHVP_S3_BUCKET: mhvp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Ensure psql
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client)
      - name: Bootstrap database roles (ADR 0002)
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: ${{ env.CI_POSTGRES_PASSWORD }}
          MHVP_DB_MIGRATOR_PASSWORD: ${{ env.CI_MIGRATOR_PASSWORD }}
          MHVP_DB_APP_PASSWORD: ${{ env.CI_APP_PASSWORD }}
        run: sh infra/postgres/bootstrap.sh
      - name: Install
        working-directory: apps/api
        run: uv sync --locked
      - name: Ruff
        working-directory: apps/api
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Mypy
        working-directory: apps/api
        run: uv run mypy
      - name: Migrations
        working-directory: apps/api
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - name: Tests
        working-directory: apps/api
        env:
          MHVP_REQUIRE_INTEGRATION: "1"
        run: uv run pytest
      - name: Backup and restore test (M9)
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: ${{ env.CI_POSTGRES_PASSWORD }}
          PGDATABASE: mhvp
          BACKUP_DIR: ${{ runner.temp }}/backup
          BACKUP_ALLOW_UNENCRYPTED: "1"
        run: |
          scripts/backup.sh
          scripts/backup-verify.sh
      - name: AI evaluation (recorded answers, no live calls)
        working-directory: apps/api
        run: uv run python -m mhvp.ai.evaluate tests/ai_eval
      - name: OpenAPI drift
        working-directory: apps/api
        run: |
          uv run python -m mhvp.openapi > openapi.json
          git diff --exit-code openapi.json

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: API client drift
        run: |
          pnpm api-client:generate
          git diff --exit-code packages/api-client
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Install Playwright Chromium
        run: pnpm --filter @mhvp/web-crm exec playwright install --with-deps chromium
      # All Playwright projects: chromium (desktop smoke) plus phone, tablet and tablet-landscape
      # for the specs tagged @mobile (M31 WP4, shell.mobile.spec.ts of both apps).
      - run: pnpm e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            apps/*/playwright-report
            apps/*/test-results
          retention-days: 7
          if-no-files-found: ignore

  e2e-backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg16
        env:
          POSTGRES_PASSWORD: ci-postgres-pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      MHVP_ENV: test
      MHVP_DATABASE_URL: postgresql+psycopg://mhvp_app:ci-app-pw@localhost:5432/mhvp
      MHVP_MIGRATION_DATABASE_URL: postgresql+psycopg://mhvp_migrator:ci-migrator-pw@localhost:5432/mhvp
      MHVP_REDIS_URL: redis://localhost:6379/0
      MHVP_CELERY_BROKER_URL: redis://localhost:6379/1
      MHVP_CELERY_RESULT_BACKEND: redis://localhost:6379/2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Ensure psql
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client)
      - name: Bootstrap database roles (ADR 0002)
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: ${{ env.CI_POSTGRES_PASSWORD }}
          MHVP_DB_MIGRATOR_PASSWORD: ${{ env.CI_MIGRATOR_PASSWORD }}
          MHVP_DB_APP_PASSWORD: ${{ env.CI_APP_PASSWORD }}
        run: sh infra/postgres/bootstrap.sh
      - name: Install API
        working-directory: apps/api
        run: uv sync --locked
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --filter @mhvp/web-crm exec playwright install --with-deps chromium
      - name: E2E against the API
        # Desktop project for every @backend spec plus the phone project (390x844, coarse
        # pointer) for the @backend @mobile specs (M31 WP4). Tablet viewports run locally with
        # MHVP_E2E_PW_ARGS="--project tablet" (docs/acceptance/M31-geraetepruefung.md).
        env:
          MHVP_E2E_PW_ARGS: "--project chromium --project phone"
        run: bash scripts/e2e-backend.sh
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-backend
          path: |
            apps/web-crm/playwright-report
            apps/web-crm/test-results
            apps/web-crm/playwright-report-api.log
          retention-days: 7
          if-no-files-found: ignore

  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dev config
        run: |
          cp .env.example .env
          docker compose --env-file .env -f infra/compose.yaml -f infra/compose.dev.yaml config -q
      - name: Prod and staging config
        env:
          POSTGRES_PASSWORD: dummy
          MHVP_DB_MIGRATOR_PASSWORD: dummy
          MHVP_DB_APP_PASSWORD: dummy
          MHVP_S3_ACCESS_KEY_ID: dummy
          MHVP_S3_SECRET_ACCESS_KEY: dummy
          MHVP_IMAGE_REGISTRY: ghcr.io/example
          MHVP_IMAGE_TAG: ci
          MHVP_HOST_MONITORING: status.example.invalid
          MHVP_HOST_METRICS: metrik.example.invalid
          TRAEFIK_NETWORK: proxy
          TRAEFIK_CERTRESOLVER: letsencrypt
          MHVP_JWT_PRIVATE_KEY: dummy
          MHVP_MASTER_KEY: dummy
        run: |
          rm -f .env infra/.env
          docker compose -p mhvp -f infra/compose.yaml -f infra/compose.prod.yaml config -q
          ACME_EMAIL=ci@example.invalid docker compose -p mhvp-edge -f infra/compose.edge.yaml config -q
          bash -n scripts/*.sh infra/scripts/*.sh
          MHVP_ENV=staging MHVP_TRAEFIK_PREFIX=mhvp-staging MHVP_HOST_CRM=crm.staging.mueller-holding.ag \
            docker compose -p mhvp-staging -f infra/compose.yaml -f infra/compose.prod.yaml config -q
      # Manual server release (docs/runbooks/release.md): stub based tests, shellcheck when present.
      - name: Release script
        run: |
          if command -v shellcheck > /dev/null; then
            shellcheck infra/scripts/release.sh infra/scripts/tests/test-release.sh
          fi
          bash infra/scripts/tests/test-release.sh

  dependency-audit:
    # GAH-310: pip-audit and pnpm audit --prod against the lockfiles before the image build.
    # Tool or network failures only warn; findings need an entry in .github/audit-allowlist.txt.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: python3 scripts/dependency_audit.py

  images:
    needs: [api, web, dependency-audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build images
        run: |
          docker build -t mhvp-api:ci apps/api
          docker build -f apps/web-crm/Dockerfile -t mhvp-web-crm:ci .
          docker build -f apps/web-portal/Dockerfile -t mhvp-web-portal:ci .
      - name: Trivy scan (CRITICAL, HIGH, fixed only)
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          for image in mhvp-api:ci mhvp-web-crm:ci mhvp-web-portal:ci; do
            echo "::group::trivy $image"
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock:ro \
              -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
              "$TRIVY_IMAGE" image \
              --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed --no-progress \
              "$image"
            echo "::endgroup::"
          done

  # GA14-05, AC11-01 (M13, OPEN_QUESTIONS P05, AA02-03): check of generated XRechnung files
  # with the official KoSIT validator. Download URLs and SHA-256 checksums are pinned in the
  # repository (scripts/kosit.lock); the repository variables KOSIT_JAR_URL, KOSIT_JAR_SHA256,
  # KOSIT_CFG_URL and KOSIT_CFG_SHA256 are optional overrides, not a precondition. Switch the
  # job off with the repository variable MHVP_KOSIT_ENABLED=false. Not blocking until the
  # operator has decided on licence and versions (continue-on-error).
  xrechnung-kosit:
    if: ${{ vars.MHVP_KOSIT_ENABLED != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      # The ubuntu-24.04 runner image ships a Temurin JDK; no extra action is needed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Fetch pinned KoSIT validator and XRechnung configuration
        env:
          KOSIT_JAR_URL: ${{ vars.KOSIT_JAR_URL }}
          KOSIT_JAR_SHA256: ${{ vars.KOSIT_JAR_SHA256 }}
          KOSIT_CFG_URL: ${{ vars.KOSIT_CFG_URL }}
          KOSIT_CFG_SHA256: ${{ vars.KOSIT_CFG_SHA256 }}
        run: |
          set -euo pipefail
          MHVP_KOSIT_DIR="$RUNNER_TEMP/kosit" scripts/kosit_fetch.sh
          echo "MHVP_KOSIT_DIR=$RUNNER_TEMP/kosit" >> "$GITHUB_ENV"
      - name: Validate generator output
        working-directory: apps/api
        run: uv run pytest tests/unit/test_aa02_kosit_validator.py -q -rs --no-cov
