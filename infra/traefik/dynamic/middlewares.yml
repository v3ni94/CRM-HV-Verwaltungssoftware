# Dev middlewares (file provider). Production defines equivalent middlewares as labels
# in compose.prod.yaml because the file provider of the existing server Traefik is unknown.
http:
  middlewares:
    security-headers:
      headers:
        frameDeny: true
        contentTypeNosniff: true
        referrerPolicy: strict-origin-when-cross-origin
        customResponseHeaders:
          Permissions-Policy: "camera=(), microphone=(), geolocation=(), payment=()"
        # No HSTS in dev (plain HTTP on *.localhost); HSTS is set in production only.
    api-ratelimit:
      rateLimit:
        average: 100
        burst: 200
        period: 1s
    # Login paths (M9-05, GAI-116): stricter than api-ratelimit; attached to the login routers
    # of the CRM and portal hosts (web-crm-auth, web-portal-auth in compose.dev.yaml).
    auth-ratelimit:
      rateLimit:
        average: 30
        burst: 10
        period: 1m
